<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>XPadite — You're offline</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
      background:#0d0d1a;color:#e5e7eb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    main{max-width:340px}
    img{width:72px;height:72px;border-radius:16px;margin-bottom:18px}
    h1{font-size:20px;margin:0 0 8px;color:#fff}
    p{font-size:14px;line-height:1.5;margin:0 0 20px;color:#9ca3af}
    button{font:inherit;font-weight:600;font-size:14px;padding:11px 22px;border:0;border-radius:10px;color:#fff;
      background:linear-gradient(135deg,#7c3aed,#5b21b6);cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="XPadite">
    <h1>You're offline</h1>
    <p>XPadite needs an internet connection to load your planner. Check your connection and try again — your data is safe.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
